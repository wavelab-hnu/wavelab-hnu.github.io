<text x="610.0" y="110.0" font-size="14" font-weight="700">f = f<tspan dy="4" font-size="0.75em">c</tspan><tspan dy="-4"> + (f<tspan dy="4" font-size="0.75em">0</tspan><tspan dy="-4"> − f<tspan dy="4" font-size="0.75em">c</tspan><tspan dy="-4">) e</tspan></tspan></tspan><tspan dy="-6" font-size="0.75em">−kt</tspan></text>
<text x="610.0" y="142.0" font-size="12.5" fill="#5b6876">f<tspan dy="4" font-size="0.75em">0</tspan><tspan dy="-4"> = 60 mm/h at the start</tspan></text>
<text x="610.0" y="162.0" font-size="12.5" fill="#5b6876">f<tspan dy="4" font-size="0.75em">c</tspan><tspan dy="-4"> = 10 mm/h in the end</tspan></text>
<text x="610.0" y="182.0" font-size="12.5" fill="#5b6876">k = 2 per hour</text>
